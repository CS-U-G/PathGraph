[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pathgraph-ai"
version = "0.1.0"
description = "PathGraph AI Recommendation Service"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10.0",
    "pydantic-settings>=2.5.0",
    "pyyaml>=6.0.0",
    "jsonschema>=4.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
serve = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "networkx>=3.2.0",
    "rapidfuzz>=3.9.0",
    "onnxruntime>=1.19.0",
    "tokenizers>=0.20.0",
]
build = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "networkx>=3.2.0",
    "rapidfuzz>=3.9.0",
    "torch",
    "sentence-transformers",
    "onnx",
    "onnxruntime",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
